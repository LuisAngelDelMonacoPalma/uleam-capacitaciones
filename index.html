<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULEAM - Plataforma de Capacitaciones en Línea</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script src="core/tailwind-config.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-100 font-sans text-gray-800 antialiased min-h-screen flex flex-col">

    <!-- Cada <div data-include="..."> se reemplaza al iniciar por el contenido del archivo indicado (ver core/loader.js) -->

    <!-- Encabezado / barra de navegación -->
    <div data-include="shared/header.html"></div>

    <!-- Contenedor principal de vistas -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
        <div data-include="shared/auth.html"></div>            <!-- #view-auth -->
        <div data-include="student/dashboard.html"></div>      <!-- #view-student -->
        <div data-include="instructor/dashboard.html"></div>   <!-- #view-instructor -->
        <div data-include="admin/dashboard.html"></div>        <!-- #view-admin -->
        <div data-include="shared/classroom.html"></div>       <!-- #view-classroom -->
        <div data-include="shared/course-editor.html"></div>   <!-- #view-editor -->
    </main>

    <div data-include="shared/footer.html"></div>

    <!-- Modales y paneles superpuestos -->
    <div data-include="shared/notifications-modal.html"></div>
    <div data-include="shared/profile-modal.html"></div>
    <div data-include="shared/logout-modal.html"></div>
    <div data-include="student/enroll-modal.html"></div>
    <div data-include="shared/quiz-modal.html"></div>
    <div data-include="shared/participants-modal.html"></div>
    <div data-include="shared/add-content-modal.html"></div>

    <!-- Lógica de la aplicación -->
    <script src="core/state.js"></script>
    <script src="core/loader.js"></script>
    <script src="core/navigation.js"></script>
    <script src="shared/header.js"></script>
    <script src="shared/auth.js"></script>
    <script src="student/student.js"></script>
    <script src="shared/classroom.js"></script>
    <script src="instructor/instructor.js"></script>
    <script src="admin/admin.js"></script>
    <script src="shared/course-editor.js"></script>
    <script src="shared/profile-notifications.js"></script>
    <script src="core/main.js"></script>

</body>
</html>
