<!-- ==================== VISTA: AULA VIRTUAL ==================== -->
<section id="view-classroom" class="space-y-6 hidden">
    <!-- Breadcrumb Navigation -->
    <div class="flex items-center space-x-2 text-xs font-semibold text-gray-500">
        <button onclick="navigateToDashboard()" class="hover:text-uleam-red">Inicio</button>
        <span>/</span>
        <span id="classroom-breadcrumb-course" class="text-gray-800">Curso</span>
    </div>

    <!-- Course Header Card -->
    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 flex flex-col md:flex-row gap-6">
        <div class="w-full md:w-1/3 bg-gray-100 rounded-lg overflow-hidden border relative h-48 flex items-center justify-center">
            <img id="classroom-banner" src="" class="w-full h-full object-cover" alt="Portada del curso">
        </div>
        <div class="flex-1 space-y-3">
            <div class="flex justify-between items-start">
                <h2 id="classroom-title" class="text-2xl font-bold text-uleam-red">Título del curso</h2>
                <div id="classroom-actions" class="flex gap-2">
                    <!-- Dynamic: View Participants, Edit, etc. -->
                </div>
            </div>
            <p id="classroom-desc" class="text-sm text-gray-600">Descripción detallada del curso...</p>
            <div class="flex flex-wrap gap-4 text-xs font-medium text-gray-500 pt-2 border-t">
                <div><strong class="text-gray-700">Categoría:</strong> <span id="classroom-category">Programación</span></div>
                <div><strong class="text-gray-700">Docente:</strong> <span id="classroom-instructor">Luis Del Mónaco</span></div>
            </div>
        </div>
    </div>

    <!-- Modules Accordion & Content Viewer Grid -->
    <div id="classroom-main-content" class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- Left/Main Column: Active Content Viewer -->
        <div class="lg:col-span-2 space-y-4">
            <div id="lesson-player-container" class="bg-black rounded-xl overflow-hidden shadow border border-gray-800 h-80 sm:h-96 flex flex-col justify-center items-center relative">
                <!-- Video or Slide Placeholder -->
                <div id="player-content-area" class="text-center p-6 text-white w-full">
                    <i class="fa-solid fa-circle-play text-6xl text-uleam-red mb-4 animate-pulse"></i>
                    <h3 id="player-title" class="text-lg font-bold">Selecciona una lección</h3>
                    <p id="player-subtitle" class="text-xs text-gray-400 mt-1">El contenido en video se mostrará en esta área</p>
                </div>
            </div>

            <!-- Lesson Actions / Status -->
            <div class="bg-white p-4 rounded-xl shadow-sm border flex justify-between items-center">
                <span id="player-lesson-name" class="font-bold text-sm text-gray-800">Lección activa</span>
                <button id="btn-mark-completed" onclick="markCurrentLessonComplete()" class="bg-uleam-green hover:bg-uleam-greenHover text-white px-4 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-2">
                    <i class="fa-solid fa-check"></i> Marcar como completada
                </button>
            </div>
        </div>

        <!-- Right Column: Modules and Lessons Navigation List -->
        <div class="space-y-4">
            <h3 class="text-md font-bold text-gray-800 flex items-center justify-between">
                <span>Contenido del curso</span>
                <span id="classroom-completion-badge" class="text-xs bg-gray-100 text-gray-600 px-2 py-1 rounded border">0%</span>
            </h3>

            <div id="classroom-modules-accordion" class="space-y-3 max-h-[500px] overflow-y-auto pr-1">
                <!-- Modules populated dynamically -->
            </div>

            <!-- Certificate Box if finished -->
            <div id="classroom-certificate-box" class="bg-green-50 border border-green-200 p-4 rounded-xl text-center space-y-2 hidden">
                <i class="fa-solid fa-award text-3xl text-green-600"></i>
                <h4 class="font-bold text-sm text-green-900">¡Felicitaciones! Has completado este curso.</h4>
                <button onclick="downloadCertificate()" class="bg-uleam-red hover:bg-uleam-redHover text-white font-bold px-4 py-2 rounded-lg text-xs w-full shadow transition">
                    <i class="fa-solid fa-file-pdf mr-1"></i> Descargar certificado
                </button>
            </div>
        </div>
    </div>
</section>
