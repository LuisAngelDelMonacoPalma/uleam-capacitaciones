<!-- Modal: Agregar elemento (lección, recurso, evaluación) en el editor -->
<div id="modal-add-content" class="fixed inset-0 modal-backdrop z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-xl shadow-2xl max-w-md w-full p-6 space-y-4 border border-gray-200">
        <h3 class="font-bold text-base text-gray-800 border-b pb-2">Elija un elemento para agregar</h3>
        <div class="grid grid-cols-1 gap-3">
            <button onclick="selectNewItemType('leccion')" class="p-3 border rounded-lg hover:bg-gray-50 flex items-center space-x-3 text-left">
                <div class="w-10 h-10 bg-red-100 text-uleam-red rounded-full flex items-center justify-center"><i class="fa-solid fa-video"></i></div>
                <div>
                    <p class="font-bold text-sm text-gray-800">Lección (Video / Clase)</p>
                    <p class="text-xs text-gray-500">Video explicativo de la clase</p>
                </div>
            </button>
            <button onclick="selectNewItemType('recurso')" class="p-3 border rounded-lg hover:bg-gray-50 flex items-center space-x-3 text-left">
                <div class="w-10 h-10 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center"><i class="fa-solid fa-file-arrow-down"></i></div>
                <div>
                    <p class="font-bold text-sm text-gray-800">Recurso (Archivo / Archivo adjunto)</p>
                    <p class="text-xs text-gray-500">PDF, Código o documento descargable</p>
                </div>
            </button>
            <button onclick="selectNewItemType('evaluacion')" class="p-3 border rounded-lg hover:bg-gray-50 flex items-center space-x-3 text-left">
                <div class="w-10 h-10 bg-green-100 text-uleam-green rounded-full flex items-center justify-center"><i class="fa-solid fa-list-check"></i></div>
                <div>
                    <p class="font-bold text-sm text-gray-800">Evaluación (Cuestionario)</p>
                    <p class="text-xs text-gray-500">Prueba de conocimientos con preguntas</p>
                </div>
            </button>
        </div>
        <button onclick="closeAddContentModal()" class="w-full py-2 border rounded-lg text-xs font-bold text-gray-600">Cancelar</button>
    </div>
</div>
