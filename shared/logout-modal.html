<!-- Modal: Confirmación de cierre de sesión -->
<div id="modal-logout" class="fixed inset-0 modal-backdrop z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-xl shadow-2xl max-w-sm w-full p-6 text-center space-y-4 border">
        <div class="w-12 h-12 bg-red-100 text-uleam-red rounded-full flex items-center justify-center mx-auto text-xl">
            <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
        <h3 class="text-lg font-bold text-gray-800">¿Continuar?</h3>
        <p class="text-sm text-gray-600">Se cerrará tu sesión en la plataforma.</p>
        <div class="flex justify-center gap-3 pt-2">
            <button onclick="closeLogoutModal()" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-800 text-xs font-bold rounded-lg transition">Cancelar</button>
            <button onclick="executeLogout()" class="px-4 py-2 bg-uleam-red hover:bg-uleam-redHover text-white text-xs font-bold rounded-lg transition shadow">Cerrar sesión</button>
        </div>
    </div>
</div>
