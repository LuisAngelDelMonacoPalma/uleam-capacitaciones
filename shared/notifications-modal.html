<!-- Modal: Panel de notificaciones -->
<div id="modal-notifications" class="fixed inset-0 modal-backdrop z-50 flex justify-end hidden">
    <div class="bg-white w-full max-w-sm h-full shadow-2xl p-6 flex flex-col justify-between animate-slide-left">
        <div>
            <div class="flex justify-between items-center border-b pb-3 mb-4">
                <h3 class="font-bold text-lg text-uleam-red flex items-center gap-2">
                    <i class="fa-regular fa-bell"></i> Notificaciones
                </h3>
                <button onclick="toggleNotifications()" class="text-gray-400 hover:text-gray-600 text-lg">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div id="notifications-list" class="space-y-2 overflow-y-auto max-h-[75vh]">
                <!-- Notifications items -->
            </div>
        </div>
        <button onclick="clearNotifications()" class="w-full text-center text-xs text-gray-500 hover:underline pt-4 border-t">
            Limpiar notificaciones
        </button>
    </div>
</div>
